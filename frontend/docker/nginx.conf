# Политика кеширования статики.
# Порядок регулярок важен: nginx проверяет их сверху вниз.
#   /assets/*        — бандлы Vite с хешем в имени, содержимое неизменно → кешируем на год
#   картинки/шрифты  — без хеша в имени, могут быть заменены → сутки
#   всё остальное    — прежде всего index.html: точка входа со ссылками на бандлы,
#                      её нельзя кешировать, иначе после деплоя браузер тянет старую сборку
map $uri $cache_control {
    default                                          "no-cache";
    ~^/assets/                                       "public, max-age=31536000, immutable";
    ~*\.(png|jpe?g|gif|ico|svg|webp|woff2?|ttf|eot)$ "public, max-age=86400";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Заголовки задаём на уровне server, чтобы они наследовались всеми location.
    # (add_header внутри location отменяет все унаследованные add_header.)
    add_header Cache-Control $cache_control always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy to Python API (backend_service)
    location /api {
        proxy_pass http://backend_service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # Ответы API не кешируем
        add_header Cache-Control "no-store" always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
