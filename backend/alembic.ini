[alembic]
# Путь до пакета с миграциями (относительно самого alembic.ini, а не CWD).
script_location = %(here)s/app/infra/migrations

# Шаблон имени файла ревизии: 0001_20260823_1200_add_something.py
file_template = %%(rev)s_%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Чтобы `app` и `settings` резолвились при запуске из backend/.
prepend_sys_path = .
path_separator = os

# Даты в именах ревизий в UTC.
timezone = UTC

# URL берётся из settings в migrations/env.py, здесь оставлен пустым намеренно.
sqlalchemy.url =


[post_write_hooks]
hooks = ruff,black
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME
black.type = exec
black.executable = black
black.options = REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
