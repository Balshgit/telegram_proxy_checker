volumes:
  postgres_db_data:

networks:
  prc_network:
    name:
      "prc_network"
    ipam:
      config:
        - subnet: 201.10.0.0/24

services:
  db:
    image: "postgres:18.4"
    container_name: "postgres_db"
    restart: unless-stopped
    profiles: [ "app", "db", "backend" ]
    networks:
      prc_network:
        ipv4_address: 201.10.0.10
    volumes:
      - postgres_db_data:/var/lib/postgresql
    env_file: envs/.env
    expose:
      - "5432"
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    image: "tpc_backend:latest"
    container_name: "backend_service"
    depends_on:
      db:
        condition: service_healthy
    platform: linux/amd64
    restart: unless-stopped
    profiles: [ "app", "backend", "frontend"]
    networks:
      prc_network:
        ipv4_address: 201.10.0.11
    volumes:
      - ./envs/:/envs/:ro
    environment:
      DB_HOST: "db"
    ports:
      - "8000:8000"
    expose:
      - "8000"
    command:
      - server

  frontend:
    image: "tpc_frontend:latest"
    container_name: "frontend_service"
    depends_on:
      - backend
    platform: linux/amd64
    restart: unless-stopped
    profiles: [ "app", "frontend" ]
    networks:
      prc_network:
        ipv4_address: 201.10.0.12
    volumes:
      - ./envs/:/envs/:ro
    ports:
      - "80:80"
      - "8080:80"
      - "443:443"
    environment:
      - NODE_ENV=production
